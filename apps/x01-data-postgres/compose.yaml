name: x01-data-postgres

services:
  postgres:
    image: postgres:15
    container_name: x01-data-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - x01-data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      x01.layer: data
      x01.module: postgres
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

networks:
  x01-data-net:
    external: true
