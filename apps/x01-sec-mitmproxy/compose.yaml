name: x01-sec-mitmproxy

services:
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: x01-sec-mitmproxy
    restart: unless-stopped
    command: >
      mitmweb
      --web-host 0.0.0.0 --web-port 8081
      --listen-host 0.0.0.0 --listen-port 8080
      --set block_global=false
      --set termlog_verbosity=info
      --set web_password=${MITMWEB_PASSWORD:-CHANGE_ME}
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./data:/home/mitmproxy/.mitmproxy
    labels:
      x01.layer: sec
      x01.module: mitmproxy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
